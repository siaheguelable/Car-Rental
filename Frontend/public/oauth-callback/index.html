<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OAuth Redirect</title>
    <script>
      // Immediately replace to root with oauth flag so SPA can complete the flow
      (function () {
        try {
          // Preserve any existing search params from the URL
          const params = new URLSearchParams(window.location.search);
          // Add oauth=github if not present
          if (!params.has('oauth')) params.set('oauth', 'github');
          const target = '/' + (params.toString() ? '?' + params.toString() : '');
          window.location.replace(target);
        } catch (e) {
          // Fallback
          window.location.replace('/?oauth=github');
        }
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to application...</p>
    <p>If you are not redirected automatically, <a id="link" href="/?oauth=github">click here</a>.</p>
  </body>
</html>
